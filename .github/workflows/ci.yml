name: CI

on:
  push:
  pull_request:

jobs:
  flutter-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stopka_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  server:
    runs-on: ubuntu-latest
    env:
      TEST_DB_PASSWORD: ci-test-password
      DEV_DB_PASSWORD: ci-dev-password
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
        working-directory: stopka_server
      - name: Test database
        working-directory: stopka_server
        run: |
          printf 'test:\n  database: ci-test-password\n' > config/passwords.yaml
          docker compose up -d postgres_test
          sleep 10
      - run: dart test
        working-directory: stopka_server

  apk:
    # A debug APK only on main, as BACKEND.md asks.
    if: github.ref == 'refs/heads/main'
    needs: [flutter-app]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stopka_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
